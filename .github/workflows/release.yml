name: 🚀 Desktop App Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-15
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: 코드 검사
        run: npm run check

      - name: TypeScript 컴파일
        run: npm run build:ts

      - name: 웹 빌드 (Vite)
        run: npm run build:web

      - name: Electron 빌드 (macOS arm64)
        run: npx electron-builder --mac --arm64 --publish never

      - name: dist 디렉터리 확인 (macOS)
        run: ls -la dist/

      - name: macOS 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: installers-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap

  build-windows:
    runs-on: windows-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: 코드 검사
        run: npm run check

      - name: TypeScript 컴파일
        run: npm run build:ts

      - name: 웹 빌드 (Vite)
        run: npm run build:web

      - name: Electron 빌드 (Windows x64)
        run: npx electron-builder --win --x64 --publish never

      - name: dist 디렉터리 확인 (Windows)
        run: dir dist\

      - name: Windows 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/*.blockmap

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: macOS 설치 프로그램 다운로드
        uses: actions/download-artifact@v4
        with:
          name: installers-mac
          path: dist

      - name: Windows 설치 프로그램 다운로드
        uses: actions/download-artifact@v4
        with:
          name: installers-windows
          path: dist

      - name: dist 디렉터리 확인 (최종)
        run: |
          echo "dist/ 파일 목록:"
          ls -la dist/

      - name: GitHub 릴리즈 생성 및 아티팩트 첨부
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.yml
            dist/*.blockmap

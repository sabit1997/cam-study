name: 🚀 Desktop App Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-15
    # 데스크탑 릴리즈는 로컬 모드로 빌드한다. 도메인 데이터는 이 기기에만 저장하고
    # AI 요청만 웹 배포본(AI_PROXY_URL)으로 프록시한다. Gemini API 키는 앱 번들에
    # 절대 들어가지 않는다(.env.example 참고).
    env:
      VITE_APP_MODE: local
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: 코드 검사
        run: npm run check

      - name: TypeScript 컴파일
        run: npm run build:ts
        env:
          # YOUTUBE_API_KEY는 로컬 모드에서도 유용하다 — /api/check-youtube이
          # 유튜브 창의 임베드 검증·제목 조회를 그대로 담당한다.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # 앱은 AI 요청을 이 주소로 프록시한다. Origin이 붙지 않는 서버-투-서버
          # 호출이라 상류가 Turnstile 없이도 받아준다.
          AI_PROXY_URL: https://www.oeyo-cam.site

      - name: 웹 빌드 (Vite)
        run: npm run build:web

      - name: Electron 빌드 (macOS arm64)
        run: npx electron-builder --mac --arm64 --publish never

      - name: release 디렉터리 확인 (macOS)
        run: ls -la release/

      - name: macOS 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: installers-mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap

  build-windows:
    runs-on: windows-latest
    env:
      VITE_APP_MODE: local
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: 코드 검사
        run: npm run check

      - name: TypeScript 컴파일
        run: npm run build:ts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          AI_PROXY_URL: https://www.oeyo-cam.site

      - name: 웹 빌드 (Vite)
        run: npm run build:web

      - name: Electron 빌드 (Windows x64)
        run: npx electron-builder --win --x64 --publish never

      - name: release 디렉터리 확인 (Windows)
        run: dir release\

      - name: Windows 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.blockmap

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: macOS 설치 프로그램 다운로드
        uses: actions/download-artifact@v4
        with:
          name: installers-mac
          path: dist

      - name: Windows 설치 프로그램 다운로드
        uses: actions/download-artifact@v4
        with:
          name: installers-windows
          path: dist

      - name: dist 디렉터리 확인 (최종)
        run: |
          echo "dist/ 파일 목록:"
          ls -la dist/

      - name: GitHub 릴리즈 생성 및 아티팩트 첨부
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
